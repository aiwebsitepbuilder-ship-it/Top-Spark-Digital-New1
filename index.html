    <script>
      // Gracefully prevent unhandled WebSocket / HMR rejections in preview sandbox environments
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason || '') + ' ' + String(event.reason?.stack || '');
        if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('createWebSocketModuleRunnerTransport')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = String(event.message || '') + ' ' + String(event.filename || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
          event.preventDefault();
        }
      }, true);
    </script>
    <script>
      // Single Page App redirect restoration for GitHub Pages and static hosts
      (function(l) {
        try {
          if (l.search && l.search[1] === '/' ) {
            var decoded = l.search.slice(1).split('&').map(function(s) { 
              return s.replace(/~and~/g, '&');
            }).join('?');
            var base = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
            window.history.replaceState(null, null,
                base + decoded + l.hash
            );
          }
        } catch (e) {
          console.warn('[SPA] Redirect restoration bypassed:', e);
        }
      }(window.location));
    </script>
